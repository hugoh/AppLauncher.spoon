[tools]
actionlint = "1.7.12"
pinact = "5.0.0"
biome = "2.5.13"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hk = "2.0.0"
shellcheck = "0.11.0"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.31.0"
rumdl = "0.2.73"
stylua = "2.5.2"
tombi = "1.5.5"
typos = "1.50.1"
uv = "0.12.13"
"github:owenlamont/ryl" = "0.22.0"
zizmor = "1.30.1"

[tasks.docs]
run = "uvx --from git+https://github.com/hugoh/spoon-tools spoon-generate-docs"
description = "Generate docs/docs.json and docs/index.html from docstrings"

[tasks.package]
depends = ["docs"]
run = """
rm -rf dist
mkdir -p dist/AppLauncher.spoon
cp init.lua LICENSE README.md docs/docs.json dist/AppLauncher.spoon/
cd dist
zip -r ../AppLauncher.spoon.zip AppLauncher.spoon
cd ..
rm -rf dist
"""
description = "Build a self-contained AppLauncher.spoon.zip (includes docs.json)"

[tasks.test]
run = "busted test_spec.lua --verbose"

[hooks]
postinstall = ["luarocks install busted"]
